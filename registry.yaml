version: 1
services:
  - name: pink-transcriber
    repo: pink-tools/pink-transcriber
    type: cli
    system_deps:
      - name: ffmpeg
        brew: ffmpeg
        apt: ffmpeg
        winget: Gyan.FFmpeg

  - name: pink-whisper
    repo: pink-tools/pink-whisper
    type: daemon
    has_setup: true

  - name: pink-voice
    repo: pink-tools/pink-voice
    type: daemon
    dependencies:
      - pink-transcriber
    env_vars:
      - name: TRANSCRIPTION_PREFIX
        default: ""

  - name: pink-elevenlabs
    repo: pink-tools/pink-elevenlabs
    type: cli
    env_vars:
      - name: ELEVENLABS_API_KEY
        required: true
      - name: ELEVENLABS_TTS_VOICE_ID
        default: ""
      - name: ELEVENLABS_VOICE_CHANGE_ID
        default: ""

  - name: pink-agent
    repo: pink-tools/pink-agent
    type: daemon
    has_setup: true
    env_vars:
      - name: TELEGRAM_BOT_TOKEN
        required: true
      - name: TELEGRAM_GROUP_ID
        required: true
    system_deps:
      - name: git
        winget: Git.Git
      - name: claude
        unix_script: "curl -fsSL https://claude.ai/install.sh | bash"
        winget: Anthropic.ClaudeCode

  - name: pink-silero
    repo: pink-tools/pink-silero
    type: daemon
    system_deps:
      - name: ffmpeg
        brew: ffmpeg
        apt: ffmpeg
        winget: Gyan.FFmpeg
      - name: uv
        brew: uv
        unix_script: "curl -LsSf https://astral.sh/uv/install.sh | sh"

  - name: pink-tts
    repo: pink-tools/pink-tts
    type: cli
    dependencies:
      - pink-silero
